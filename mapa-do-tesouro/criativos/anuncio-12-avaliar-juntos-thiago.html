<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Mapa do Tesouro — Criativo Avaliar Juntos (Thiago)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c8a84b;--gold2:#e9d38f;
  --cream:#f4efe6;
  --disp:'Fraunces',Georgia,serif;
  --sans:'Plus Jakarta Sans',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{font-family:var(--sans);color:var(--cream);overflow:hidden;position:relative;
  background:#0c1613 url('../images/thiago-bio.webp') center 22% / cover no-repeat}

.overlay{position:absolute;inset:0;
  background:
    linear-gradient(to bottom, rgba(6,10,8,.94) 0%, rgba(6,10,8,.7) 20%, rgba(6,10,8,.15) 38%, rgba(6,10,8,.1) 54%, rgba(6,10,8,.62) 72%, rgba(6,10,8,.93) 88%, rgba(4,7,6,.98) 100%);
}

.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:60px 62px 0}

.tag{display:inline-flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold2);margin-bottom:30px}
.tag::before,.tag::after{content:'';width:28px;height:1px;background:var(--gold)}

h1{font-family:var(--disp);font-weight:700;font-size:66px;line-height:1.14;letter-spacing:-.01em;
  max-width:960px}
h1 .w{color:var(--cream)}
h1 .g{color:var(--gold2);text-shadow:0 0 44px rgba(200,168,75,.5)}

.spacer{flex:1}

.lower{display:flex;flex-direction:column;align-items:center}

.sub{font-family:var(--sans);font-size:32px;font-weight:500;color:rgba(244,239,230,.94);
  line-height:1.4;margin-bottom:36px;max-width:780px;
  text-shadow:0 2px 18px rgba(0,0,0,.7)}
.sub b{color:var(--gold2);font-weight:700}

.date{display:inline-flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.04em;
  color:var(--cream);background:rgba(200,168,75,.16);border:1px solid rgba(200,168,75,.55);
  padding:17px 32px;border-radius:4px;margin-bottom:36px}
.date::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--gold2);flex-shrink:0;
  box-shadow:0 0 10px rgba(233,211,143,.8)}

.ctabar{margin:0 -62px 0;padding:40px 62px;background:linear-gradient(135deg,var(--gold2),var(--gold));
  display:flex;align-items:center;justify-content:center;gap:16px}
.ctabar__txt{font-family:var(--sans);font-size:38px;font-weight:800;color:#1a1206;letter-spacing:-.01em}
.ctabar__arrow{width:38px;height:38px;flex-shrink:0}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="wrap">
  <span class="tag">Imersão ao vivo, 15 de agosto</span>

  <h1><span class="w">EM 1 DIA, VAMOS AVALIAR JUNTOS</span> <span class="g">O POTENCIAL TURÍSTICO DA SUA TERRA</span></h1>

  <div class="spacer"></div>

  <div class="lower">
    <p class="sub">E você sai com um <b>relatório em mãos</b> para decidir com clareza, não no escuro</p>

    <span class="date">Sábado · 8h às 14h · por R$47</span>
  </div>

  <div class="ctabar">
    <svg class="ctabar__arrow" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <span class="ctabar__txt">Clique em "Saiba mais" e garanta sua vaga</span>
  </div>
</div>
</body>
</html>
